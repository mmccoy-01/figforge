[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "figforge"
version = "0.13.0b1"
description = "A scientific figure assembly app for lane-based images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=11,<13",
    "shiny>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
]

[tool.setuptools.packages.find]
include = ["figforge*"]

[tool.setuptools.package-data]
figforge = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
